name: Build ShyTalk APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug -x processDevDebugGoogleServices

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShyTalk-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
